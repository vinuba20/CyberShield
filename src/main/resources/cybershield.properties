# Detection and correlation settings. Change a value here and restart; no code change needed.
# Any of them can also be set on the command line, e.g. -Dcybershield.detection.bruteforce.threshold=8

# Rule: at least <threshold> failed logins from one source within <window.seconds>
cybershield.detection.bruteforce.threshold=5
cybershield.detection.bruteforce.window.seconds=10

# Rule: at least <failures> failed logins, then a success for the same user and source, within <window.seconds>
cybershield.detection.failthensuccess.failures=3
cybershield.detection.failthensuccess.window.seconds=60

# Correlation: alerts closer than <window.seconds> that match on any enabled criterion form one incident
cybershield.correlation.window.seconds=300
cybershield.correlation.match.source=true
cybershield.correlation.match.rule=false
cybershield.correlation.match.eventtype=false
